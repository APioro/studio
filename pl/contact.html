<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisAlchemist Branding & Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;700&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="styles.css">
   
      <!-- Favicon for light mode -->
    <link rel="icon" href="logo/my-logo-black.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" href="logo/my-logo-white.png" media="(prefers-color-scheme: dark)">
   
</head>
<body>
   
   <div id="navbar"></div>
   <section>
    <div class="wrapper-contact">
    <img id="image-contact" src="/photos/about-me/img_1.jpg">
      
    <div class="wrapper-vertical">
       <div id="form-header">
           <h1>Skontaktuj się ze mną</h1>
        <p>Wypełnij formularz, aby umówić się na video czat. Porozmawiajmy o Twoim projekcie i celach. Zazwyczaj odpowiadam w ciągu 48 godzin.</p>
  </div>

      <form action="https://api.web3forms.com/submit" method="POST">
          <!-- dont delete this - its public access key (not ap key) -->
        <input type="hidden" name="access_key" value="f2f493b5-ddc5-4de3-9906-4dc88bae6833">

        <!-- Strongly recommended: metadata to lower spam score -->
      <input type="hidden" name="subject" value="New booking inquiry from website">
      <input type="hidden" name="from_name" value="Studio Booking Form">
      <input type="hidden" name="replyto" value="email"> 
          <!-- edit form here -->
        <label> Imię
          <input type="text" name="name" required>
        </label>

        <label> E-mail
          <input type="email" name="email" required>
        </label>

        <label> Marka/Nazwa Produktu
          <input type="text" name="brand-name">
        </label>

        <label> Termin realizacji
          <select name="timeframe" required>
            <option value="">Wybierz…</option>
            <option value="less-than-2-weeks">Mniej niż 2 tygodnie</option>
            <option value="2-4-weeks">2–4 tygodnie</option>
            <option value="1-2-months">1–2 miesiące</option>
            <option value="2-3-months">2–3 miesiące</option>
            <option value="ongoing">Stała współpraca</option>
          </select>
        </label>

        <label> Budżet
          <select name="budget" required>
            <option value="">Wybierz…</option>
            <option value="1000-2000">1 000 – 2 000 zł</option>
            <option value="2000-3500">2 000 – 3 500 zł</option>
            <option value="3500-6000">3 500 – 6 000 zł</option>
            <option value="6000plus">6 000 zł +</option>

          </select>
        </label>

        <label>Jak mnie znalazłeś?
          <input type="text" name="find-me">
        </label>

        <label>Opis Twojego projektu – cele i oczekiwane rezultaty (mile widziane szczegóły)
          <textarea name="message" rows="9"></textarea>
        </label>

        <!-- Honeypot -->
          <input type="checkbox" name="botcheck" class="hidden" style="display:none !important">

        <button class="button-secondary" type="submit">Prześlij</button>
      </form>
    </div>
  </div> 

</section>


    
    <div id="footer-placeholder"></div>


    <script src="/pl/footer-loader.js"></script>
    <script src="/pl/menu-loader.js"></script>
</body>
</html>
